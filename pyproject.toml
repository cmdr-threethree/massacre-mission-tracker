[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "massacre-mission-tracker"
version = "0.1.0"
description = "Stateless live Elite Dangerous massacre mission tracker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
dependencies = ["textual>=8.0", "rich>=14.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
massacre-tracker = "massacre_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
massacre_tracker = ["ui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
