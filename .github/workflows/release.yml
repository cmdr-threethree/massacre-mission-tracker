name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Check console entry point
        run: massacre-tracker --help

  build:
    name: windows bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packaging/windows/requirements.lock
      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version v$version" >&2
            exit 1
          fi
      - name: Build bundle
        run: python packaging/windows/build.py
      - name: Write checksums
        working-directory: dist
        run: sha256sum massacre-tracker-*-win64.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            dist/massacre-tracker-*-win64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  smoke-windows:
    name: smoke test windows bundle
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-bundle
          path: dist
      - name: Extract and verify checksum
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          $expected = ((Get-Content dist/SHA256SUMS) -split '\s+')[0]
          $actual = (Get-FileHash -Path $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch: expected $expected, got $actual"
          }

          Expand-Archive -Path $zip.FullName -DestinationPath extracted
          $root = Get-ChildItem extracted -Directory | Select-Object -First 1
          "BUNDLE_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Import application
        shell: pwsh
        run: |
          & "$env:BUNDLE_ROOT\python\python.exe" -B -X utf8 -c "import massacre_tracker, rich, textual; from massacre_tracker.ui.app import TrackerApp; print('import ok')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run launcher help
        shell: pwsh
        run: |
          & "$env:BUNDLE_ROOT\massacre-tracker.cmd" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify no bytecode was written
        shell: pwsh
        run: |
          $cache = Get-ChildItem -Path $env:BUNDLE_ROOT -Recurse -Directory -Filter __pycache__
          if ($cache) { throw "Bundle wrote bytecode: $($cache.FullName -join ', ')" }

  publish:
    name: publish release
    needs: [build, smoke-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-bundle
          path: dist
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Windows

          Download the `*-win64.zip` asset, unblock it in the file properties
          before extracting it, then run `massacre-tracker.cmd`. No Python
          installation is required.

          ## Linux and other platforms

          Run from source with uv or pipx:

          ```bash
          uvx --from git+https://github.com/cmdr-threethree/massacre-mission-tracker massacre-tracker --help
          ```

          See the README for journal path options and terminal notes.
          EOF

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Massacre Mission Tracker $GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              dist/*.zip dist/SHA256SUMS
          fi
