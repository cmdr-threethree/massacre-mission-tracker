name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Check console entry point
        run: massacre-tracker --help

  bundle:
    name: windows bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packaging/windows/requirements.lock
      - name: Build bundle
        run: python packaging/windows/build.py
      - name: Write checksums
        working-directory: dist
        run: sha256sum massacre-tracker-*-win64.zip > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            dist/massacre-tracker-*-win64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
